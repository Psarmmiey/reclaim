name: Release

# Release Please keeps a release PR open with the next version and changelog,
# worked out from Conventional Commits on main. Merging it tags the release;
# the build job then attaches Reclaim.app to it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        env:
          RECLAIM_SIGN: adhoc
        run: ./build-app.sh --dist dist
      - name: Stable download name
        run: |
          cp dist/Reclaim-*.zip dist/Reclaim-macOS.zip
          (cd dist && shasum -a 256 Reclaim-macOS.zip > Reclaim-macOS.zip.sha256)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.zip dist/*.sha256 --clobber
