name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the version in the code
        run: |
          code="$(python -c 'import reclaim; print(reclaim.__version__)')"
          [ "v$code" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but reclaim.__version__ is $code"; exit 1; }
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        env:
          RECLAIM_SIGN: adhoc
        run: ./build-app.sh --dist dist
      - name: Stable download name
        run: |
          cp dist/Reclaim-*.zip dist/Reclaim-macOS.zip
          (cd dist && shasum -a 256 Reclaim-macOS.zip > Reclaim-macOS.zip.sha256)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "Reclaim ${GITHUB_REF_NAME#v}" --generate-notes
